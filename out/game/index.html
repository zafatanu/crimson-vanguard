<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CRIMSON VANGUARD</title>
<style>
  /* Vendored display + body faces (zero network at runtime). */
  @font-face { font-family: 'Noto Sans Condensed'; font-weight: 800; font-display: swap; src: url('./fonts/NotoSans-CondensedExtraBold.ttf') format('truetype'); }
  @font-face { font-family: 'Noto Sans'; font-weight: 400; font-display: swap; src: url('./fonts/NotoSans-Regular.ttf') format('truetype'); }
  @font-face { font-family: 'Noto Sans'; font-weight: 700; font-display: swap; src: url('./fonts/NotoSans-Bold.ttf') format('truetype'); }
  html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; background: #BFE3F2; }
  body {
    /* Dawn sky: cool blue overhead warming to amber at the horizon. */
    background: linear-gradient(180deg, #BFE3F2 0%, #F7C95C 100%);
    font-family: 'Noto Sans', system-ui, sans-serif;
  }
  #game { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; filter: saturate(1.25) contrast(1.08); }
  /* The HUD lives in the DOM, not the WebGL scene, so it stays crisp and screen-reader-friendly. */
  #hud {
    position: fixed; inset: 0; pointer-events: none; z-index: 1;
    font-family: 'Noto Sans Condensed', 'Arial Narrow', sans-serif;
    font-weight: 800; letter-spacing: 0.02em; color: #1E1B18;
  }
  #status { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }
</style>
<link rel="stylesheet" href="./ui-tokens.css">
<link rel="stylesheet" href="./ui-components.css">
</head>
<body>
<canvas id="game" width="1280" height="800" aria-label="CRIMSON VANGUARD: fly a red iron sentinel over a burning daytime city"></canvas>
<div id="hud"></div>
<p id="status" role="status" aria-live="polite"></p>
<script type="importmap">
{
  "imports": {
    "three": "./vendor/three/three.module.js",
    "three/addons/": "./vendor/three/addons/"
  }
}
</script>
<script type="module" src="./src/main.js"></script>
</body>
</html>
