<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CRIMSON VANGUARD</title>
<style>
  html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; background: #BFE3F2; }
  body {
    /* Dawn sky: cool blue overhead warming to amber at the horizon. */
    background: linear-gradient(180deg, #BFE3F2 0%, #F7C95C 100%);
  }
  #game { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }
  /* The HUD lives in the DOM, not the WebGL scene, so it stays crisp and screen-reader-friendly. */
  #hud {
    position: fixed; inset: 0; pointer-events: none; z-index: 1;
    font-family: Georgia, serif; color: #1E1B18;
  }
  #status { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }
</style>
</head>
<body>
<canvas id="game" width="1280" height="800" aria-label="CRIMSON VANGUARD: fly a red iron sentinel over a burning daytime city"></canvas>
<div id="hud"></div>
<p id="status" role="status" aria-live="polite"></p>
<script type="importmap">
{
  "imports": {
    "three": "./vendor/three/three.module.js",
    "three/addons/": "./vendor/three/addons/"
  }
}
</script>
<script type="module" src="./src/main.js"></script>
</body>
</html>
